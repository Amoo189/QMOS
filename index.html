<!doctype html>
<html lang="fa">
<head>
<meta name="google-site-verification" content="c4cJm7Oxc8tFf9vFlvJlrD-GeovSYK3ynJdoCrNfcjY" />
<meta charset="utf-8">
<title>Quantum OS — Saleh Amoo</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<meta name="description" content="QMOS is a web-based operating system simulation with apps, games, browser and tools.">
<meta name="description" content="QMOS - A web-based simulated operating system built with JavaScript by Saleh Amoo">
<meta name="keywords" content="QMOS, Web OS, JavaScript OS, Student Project, Simulated Operating System, saleh amoo, صالح عمو">
<meta name="author" content="Saleh Amoo">
<link rel="icon" href=SA.png" type="image/png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<link rel="shortcut icon" type="x-icon" href="SA.png">

<script src="https://js.puter.com/v2/"></script>
<link rel="stylesheet" href="ii6k.css" />
<style></style>
</head>
<body style="text-align:center;">

<header class="neon-text">Quantum OS</header>

<div id="boot"><h1>Quantum OS</h1></div>



<div id="lockScreen" style="text-align:center;" align-items:center;>
 <div class="lock-wallpaper"></div>

 <div class="lock-content" style="text-align:center;">
  <h2>Quantum OS</h2>
  <p id="lockHint">Swipe up to unlock</p>

  <div id="passwordBox" class="hidden">
   <input type="number" id="lockPass" placeholder="Password">
   <button class="btn" onclick="unlock()">Unlock</button>
   <p id="lockError"></p>
  </div>
 </div>
</div>



<div id="login">
 <div class="card">
  <h3 style="color:var(--neon-cyan);margin-bottom:20px;">Login</h3>
  <input id="username" placeholder="Username">
  <button class="btn" onclick="login()" style="margin-top:20px;">Login</button>
 </div>
</div>


<div class="apps">
 <div class="app neon-card" onclick="browser()"><span><i class="fa-solid fa-globe"></i></span>Browser</div>
 <div class="app neon-card" onclick="phone()"><span><i class="fa-solid fa-phone"></i></span>Phone</div>
 <div class="app neon-card" onclick="files()"><span><i class="fa-solid fa-folder"></i></span>Files</div>
 <div class="app neon-card" onclick="music()"><span><i class="fa-solid fa-music"></i></span>Music</div>
 <div class="app neon-card" onclick="openClock()">
  <span><i class="fa-solid fa-clock"></i></span>Clock
</div>

 <div class="app neon-card" onclick="settings()"><span><i class="fa-solid fa-gear"></i></span>Settings</div>
 <div class="app neon-card" onclick="about()"><span><i class="fa-solid fa-circle-info"></i></span>About</div>
 <!--<div class="app neon-card" onclick="openAI()"><span><i class="fa-solid fa-robot"></i></span>AI</div>-->
 <div class="app neon-card" onclick="openFinance()"><span><i class="fa-solid fa-chart-line"></i></span>Finance</div>
 <div class="app neon-card" onclick="openCalc()"><span><i class="fa-solid fa-calculator"></i></span>Calculator</div>
 <div class="app neon-card" onclick="openSystem()"><span><i class="fa-solid fa-bolt"></i></span>System</div>


 <div class="app neon-card" onclick="openTicTacToe()"><span><i class="fa-solid fa-xmark"></i></span>Tic Tac Toe</div>
 <div class="app neon-card" onclick="openSudoku()"><span><i class="fa-solid fa-hashtag"></i></span>Sudoku</div>
 <div class="app neon-card" onclick="openNumberGuess()"><span><i class="fa-solid fa-wand-magic-sparkles"></i></span>Guess Game</div>
<div class="app neon-card" onclick="openRPS()">
 <span><i class="fa-solid fa-hand-fist"></i></span>Rock Paper
</div>

<div class="app neon-card" onclick="openReaction()">
 <span><i class="fa-solid fa-triangle-exclamation"></i></span>Reaction
</div>

<div class="app neon-card" onclick="openMemory()">
 <span><i class="fa-solid fa-brain"></i></span>Memory
</div>


<div class="app neon-card" onclick="openSnakeMobile()">
 <span><i class="fa-solid fa-staff-snake"></i></span>Snake
</div>

<div class="app neon-card" onclick="openClickGame()">
 <span><i class="fa-solid fa-hand-pointer"></i></span>Click Speed
</div>


<div class="app neon-card" onclick="openLeaderboard()">
 <span><i class="fa-solid fa-trophy"></i></span>Leaderboard
</div>

 <div class="app neon-card shutdown" onclick="shutdownSystem()"><span><i class="fa-solid fa-power-off"></i></span>Shutdown</div>
 <div class="app neon-card" onclick="about2()"><span><i class="fa-solid fa-circle-question"></i></span>Developer</div>
</div>

<div class="modal" id="modal">
 <div class="box">
  <button class="btn" onclick="closeM()">Close</button>
  <div id="content" style="margin-top:16px;"></div>
 </div>
</div>

<audio id="welcomeMusic">
  <source src="Soft Piano Dramatic Modern Classical Composition B (2).mp3" type="audio/mpeg">
</audio>
 <button id="pwa-exit-btn" onclick="shutdownSystem()" style="
  position:center;
  bottom:20px;
  right:20px;
  padding:18px 24px;
  background:#ff3b3b;
  color:white;
  border:none;
  border-radius:10px;
  font-size:14px;
  display:none;
  box-shadow:0 0 15px #ff3b3b;
">
  Exit App
</button>

<script src="ii6k.js"></script>
</body>
</html>
